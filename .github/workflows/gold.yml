# Gold only. A green check is not LIVE_PIN_OK, not signed L1, not Institute launch.
name: gold

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python3 -m pip install -e ".[dev]"
      - name: Gold
        run: make gold
