# Gold only. A green check is not LIVE_PIN_OK, not signed L1, not Institute launch.
name: gold

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python3 -m pip install -e ".[dev]"
      - name: Gold
        run: make gold
